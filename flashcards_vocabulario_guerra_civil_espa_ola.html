<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Flashcards: Vocabulario Guerra Civil Española</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap');
    body {
      font-family: 'Poppins', sans-serif;
    }
    .perspective-1000 {
      perspective: 1000px;
    }
    .transform-style-3d {
      transform-style: preserve-3d;
    }
    .backface-hidden {
      backface-visibility: hidden;
    }
    .rotate-y-180 {
      transform: rotateY(180deg);
    }
  </style>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex flex-col justify-between selection:bg-amber-500 selection:text-slate-900">

  <!-- HEADER -->
  <header class="w-full bg-slate-800/90 border-b border-slate-700/80 px-6 py-4 flex flex-col sm:flex-row justify-between items-center gap-3 shadow-md z-10">
    <div class="flex items-center gap-3">
      <span class="bg-amber-500 text-slate-950 font-bold px-3 py-1 rounded-md text-xs tracking-wider uppercase">Español 2</span>
      <h1 class="text-lg font-semibold text-slate-100 flex items-center gap-2">
        <i class="fa-solid fa-layer-group text-amber-400"></i> Vocabulario: La Guerra Civil Española
      </h1>
    </div>
    <div class="flex items-center gap-4 text-xs font-medium text-slate-400">
      <span class="bg-slate-900/80 px-3 py-1.5 rounded-full border border-slate-700">
        Dominados: <span id="mastered-count" class="text-green-400 font-bold">0</span> / <span id="total-count">0</span>
      </span>
    </div>
  </header>

  <!-- MAIN CONTAINER -->
  <main class="flex-1 flex flex-col items-center justify-center p-4 md:p-8 max-w-4xl mx-auto w-full">

    <!-- CATEGORY SELECTOR & CONTROLS -->
    <div class="w-full mb-6 flex flex-col sm:flex-row justify-between items-center gap-4">
      <div class="w-full sm:w-auto flex-1 max-w-xs">
        <label for="category-select" class="block text-xs uppercase font-bold text-slate-400 mb-1">Categoría:</label>
        <select id="category-select" onchange="filterCategory()" class="w-full bg-slate-800 border border-slate-700 text-slate-200 text-sm rounded-lg p-2.5 focus:ring-amber-500 focus:border-amber-500 font-medium">
          <option value="all">Todas las categorías (Todas)</option>
          <option value="A">A. Centrala historiska begrepp</option>
          <option value="B">B. Människor och grupper</option>
          <option value="C">C. Krig och våld</option>
          <option value="D">D. Flykt och konsekvenser</option>
          <option value="E">E. Orsaker och samband</option>
          <option value="F">F. Tidsuttryck</option>
        </select>
      </div>

      <div class="flex items-center gap-2 w-full sm:w-auto justify-end">
        <button onclick="shuffleCards()" class="px-3.5 py-2.5 bg-slate-800 hover:bg-slate-700 border border-slate-700 text-slate-300 text-xs font-semibold rounded-lg transition flex items-center gap-2">
          <i class="fa-solid fa-shuffle text-amber-400"></i> Blanda
        </button>
        <button onclick="resetProgress()" class="px-3.5 py-2.5 bg-slate-800 hover:bg-slate-700 border border-slate-700 text-slate-300 text-xs font-semibold rounded-lg transition flex items-center gap-2">
          <i class="fa-solid fa-rotate text-sky-400"></i> Återställ
        </button>
      </div>
    </div>

    <!-- FLASHCARD DISPLAY -->
    <div class="w-full perspective-1000 my-4">
      <div id="flashcard" onclick="flipCard()" class="relative w-full h-80 rounded-2xl bg-slate-800 border-2 border-slate-700/80 cursor-pointer shadow-2xl transition-transform duration-500 transform-style-3d hover:border-amber-500/50">
        
        <!-- FRONT SIDE (Spanish) -->
        <div id="card-front" class="absolute inset-0 w-full h-full rounded-2xl p-8 flex flex-col justify-between items-center text-center backface-hidden bg-gradient-to-br from-slate-800 to-slate-900">
          <div class="w-full flex justify-between items-center text-xs text-slate-400 font-medium border-b border-slate-700/50 pb-3">
            <span id="card-category-tag" class="bg-slate-700/60 text-amber-300 px-2.5 py-1 rounded-full">Categoría</span>
            <span class="flex items-center gap-1 text-slate-400"><i class="fa-solid fa-globe"></i> Español</span>
          </div>
          
          <div class="my-auto">
            <h2 id="card-es" class="text-3xl md:text-4xl font-bold text-white tracking-wide leading-tight mb-2">Cargando...</h2>
            <p class="text-xs text-slate-400 italic">Klicka för att se svenska</p>
          </div>

          <div class="w-full text-right text-xs text-slate-500">
            <i class="fa-solid fa-rotate"></i>
          </div>
        </div>

        <!-- BACK SIDE (Swedish) -->
        <div id="card-back" class="absolute inset-0 w-full h-full rounded-2xl p-8 flex flex-col justify-between items-center text-center backface-hidden rotate-y-180 bg-gradient-to-br from-slate-800 via-slate-850 to-amber-950/20 border-2 border-amber-500/30">
          <div class="w-full flex justify-between items-center text-xs text-slate-400 font-medium border-b border-slate-700/50 pb-3">
            <span class="bg-amber-500/10 text-amber-400 border border-amber-500/30 px-2.5 py-1 rounded-full">Översättning</span>
            <span class="flex items-center gap-1 text-slate-400"><i class="fa-solid fa-language"></i> Svenska</span>
          </div>
          
          <div class="my-auto">
            <h2 id="card-sv" class="text-2xl md:text-3xl font-semibold text-amber-300 tracking-wide leading-tight mb-2">Laddar...</h2>
          </div>

          <div class="w-full text-right text-xs text-slate-500">
            <i class="fa-solid fa-rotate"></i>
          </div>
        </div>

      </div>
    </div>

    <!-- NAVIGATION AND SCORE BUTTONS -->
    <div class="w-full flex flex-col sm:flex-row items-center justify-between gap-4 mt-4">
      <button onclick="prevCard()" class="w-full sm:w-auto px-5 py-3 bg-slate-800 hover:bg-slate-700 text-slate-200 font-medium rounded-xl border border-slate-700 transition flex items-center justify-center gap-2">
        <i class="fa-solid fa-arrow-left"></i> Föregående
      </button>

      <div class="flex items-center gap-3 w-full sm:w-auto justify-center">
        <button onclick="markStatus(false)" class="flex-1 sm:flex-none px-4 py-3 bg-red-950/60 hover:bg-red-900/80 border border-red-800 text-red-200 font-semibold rounded-xl transition text-xs flex items-center justify-center gap-2">
          <i class="fa-solid fa-xmark text-red-400"></i> Öva mer
        </button>
        <button onclick="markStatus(true)" class="flex-1 sm:flex-none px-4 py-3 bg-emerald-950/60 hover:bg-emerald-900/80 border border-emerald-800 text-emerald-200 font-semibold rounded-xl transition text-xs flex items-center justify-center gap-2">
          <i class="fa-solid fa-check text-emerald-400"></i> Kan detta
        </button>
      </div>

      <button onclick="nextCard()" class="w-full sm:w-auto px-5 py-3 bg-amber-500 hover:bg-amber-400 text-slate-950 font-bold rounded-xl transition flex items-center justify-center gap-2">
        Nästa <i class="fa-solid fa-arrow-right"></i>
      </button>
    </div>

    <!-- PROGRESS COUNTER -->
    <div class="mt-6 text-center text-xs text-slate-400 font-medium">
      Kort <span id="current-index" class="text-amber-400 font-bold">1</span> av <span id="filtered-total" class="text-slate-200">0</span>
    </div>

  </main>

  <!-- FOOTER -->
  <footer class="w-full bg-slate-800/50 border-t border-slate-800 p-4 text-center text-xs text-slate-500">
    Spanska 2 — Träna glosor till Spanska Inbördeskriget
  </footer>

  <!-- JAVASCRIPT LOGIC -->
  <script>
    const vocabulary = [
      // A. Centrala historiska begrepp
      { cat: "A", catName: "A. Centrala begrepp", es: "la Guerra Civil", sv: "inbördeskriget" },
      { cat: "A", catName: "A. Centrala begrepp", es: "la República", sv: "republiken" },
      { cat: "A", catName: "A. Centrala begrepp", es: "el gobierno", sv: "regeringen" },
      { cat: "A", catName: "A. Centrala begrepp", es: "el gobierno republicano", sv: "den republikanska regeringen" },
      { cat: "A", catName: "A. Centrala begrepp", es: "el golpe militar", sv: "militärkuppen" },
      { cat: "A", catName: "A. Centrala begrepp", es: "el ejército", sv: "armén / militären" },
      { cat: "A", catName: "A. Centrala begrepp", es: "los militares", sv: "militärerna" },
      { cat: "A", catName: "A. Centrala begrepp", es: "el bando", sv: "sidan / parten" },
      { cat: "A", catName: "A. Centrala begrepp", es: "los republicanos", sv: "republikanerna" },
      { cat: "A", catName: "A. Centrala begrepp", es: "los nacionalistas", sv: "nationalisterna" },
      { cat: "A", catName: "A. Centrala begrepp", es: "la dictadura", sv: "diktaturen" },
      { cat: "A", catName: "A. Centrala begrepp", es: "el dictador", sv: "diktatorn" },
      { cat: "A", catName: "A. Centrala begrepp", es: "la democracia", sv: "demokratin" },
      { cat: "A", catName: "A. Centrala begrepp", es: "democrático/a", sv: "demokratisk" },
      { cat: "A", catName: "A. Centrala begrepp", es: "la oposición", sv: "oppositionen / motståndet" },
      { cat: "A", catName: "A. Centrala begrepp", es: "el conflicto", sv: "konflikten" },
      { cat: "A", catName: "A. Centrala begrepp", es: "la lucha", sv: "kampen" },

      // B. Människor och grupper
      { cat: "B", catName: "B. Människor & grupper", es: "la gente", sv: "människorna / folk" },
      { cat: "B", catName: "B. Människor & grupper", es: "la población civil", sv: "civilbefolkningen" },
      { cat: "B", catName: "B. Människor & grupper", es: "los soldados", sv: "soldaterna" },
      { cat: "B", catName: "B. Människor & grupper", es: "los ciudadanos", sv: "medborgarna" },
      { cat: "B", catName: "B. Människor & grupper", es: "los refugiados", sv: "flyktingarna" },
      { cat: "B", catName: "B. Människor & grupper", es: "los exiliados", sv: "de landsflyktiga / flyktingar i exil" },
      { cat: "B", catName: "B. Människor & grupper", es: "los voluntarios", sv: "frivilliga" },
      { cat: "B", catName: "B. Människor & grupper", es: "las Brigadas Internacionales", sv: "de internationella brigaderna" },
      { cat: "B", catName: "B. Människor & grupper", es: "los aliados", sv: "allierade" },
      { cat: "B", catName: "B. Människor & grupper", es: "los adversarios", sv: "motståndarna" },

      // C. Krig och våld
      { cat: "C", catName: "C. Krig & våld", es: "la guerra", sv: "kriget" },
      { cat: "C", catName: "C. Krig & våld", es: "el ataque", sv: "attacken" },
      { cat: "C", catName: "C. Krig & våld", es: "el bombardeo", sv: "bombningen" },
      { cat: "C", catName: "C. Krig & våld", es: "bombardear", sv: "att bomba" },
      { cat: "C", catName: "C. Krig & våld", es: "el arma / las armas", sv: "vapnet / vapnen" },
      { cat: "C", catName: "C. Krig & våld", es: "el apoyo militar / la ayuda militar", sv: "militärt stöd / militär hjälp" },
      { cat: "C", catName: "C. Krig & våld", es: "la victoria", sv: "segern" },
      { cat: "C", catName: "C. Krig & våld", es: "la derrota", sv: "nederlaget" },
      { cat: "C", catName: "C. Krig & våld", es: "ganar", sv: "att vinna" },
      { cat: "C", catName: "C. Krig & våld", es: "perder", sv: "att förlora" },
      { cat: "C", catName: "C. Krig & våld", es: "morir", sv: "att dö" },
      { cat: "C", catName: "C. Krig & våld", es: "matar", sv: "att döda" },
      { cat: "C", catName: "C. Krig & våld", es: "luchar", sv: "att kämpa" },

      // D. Flykt och konsekvenser
      { cat: "D", catName: "D. Flykt & konsekvenser", es: "huir", sv: "att fly" },
      { cat: "D", catName: "D. Flykt & konsekvenser", es: "el exilio", sv: "exilen" },
      { cat: "D", catName: "D. Flykt & konsekvenser", es: "refugiarse", sv: "att ta sin tillflykt / fly" },
      { cat: "D", catName: "D. Flykt & konsekvenser", es: "abandonar", sv: "att lämna" },
      { cat: "D", catName: "D. Flykt & konsekvenser", es: "perder su hogar", sv: "att förlora sitt hem" },
      { cat: "D", catName: "D. Flykt & konsekvenser", es: "sufrir", sv: "att lida" },
      { cat: "D", catName: "D. Flykt & konsekvenser", es: "la pobreza", sv: "fattigdomen" },
      { cat: "D", catName: "D. Flykt & konsekvenser", es: "el hambre", sv: "hungern" },
      { cat: "D", catName: "D. Flykt & konsekvenser", es: "el miedo", sv: "rädslan" },
      { cat: "D", catName: "D. Flykt & konsekvenser", es: "la persecución", sv: "förföljelsen" },
      { cat: "D", catName: "D. Flykt & konsekvenser", es: "ser encarcelado/a", sv: "bli fängslad" },
      { cat: "D", catName: "D. Flykt & konsekvenser", es: "ser ejecutado/a", sv: "bli avrättad" },
      { cat: "D", catName: "D. Flykt & konsekvenser", es: "las consecuencias", sv: "konsekvenserna" },

      // E. Orsaker och samband
      { cat: "E", catName: "E. Orsaker & samband", es: "la causa / el motivo / la razón", sv: "orsaken / motivet / anledningen" },
      { cat: "E", catName: "E. Orsaker & samband", es: "provocar / causar / llevar a", sv: "orsaka / leda till" },
      { cat: "E", catName: "E. Orsaker & samband", es: "debido a", sv: "på grund av" },
      { cat: "E", catName: "E. Orsaker & samband", es: "por eso / por lo tanto", sv: "därför / följaktligen" },
      { cat: "E", catName: "E. Orsaker & samband", es: "como consecuencia", sv: "som en konsekvens" },
      { cat: "E", catName: "E. Orsaker & samband", es: "sin embargo", sv: "däremot / emellertid" },
      { cat: "E", catName: "E. Orsaker & samband", es: "aunque", sv: "även om" },

      // F. Tidsuttryck
      { cat: "F", catName: "F. Tidsuttryck", es: "al principio", sv: "i början" },
      { cat: "F", catName: "F. Tidsuttryck", es: "antes de / después de", sv: "före / efter" },
      { cat: "F", catName: "F. Tidsuttryck", es: "al mismo tiempo", sv: "samtidigt" },
      { cat: "F", catName: "F. Tidsuttryck", es: "entonces / más tarde / poco después", sv: "då / senare / strax därefter" },
      { cat: "F", catName: "F. Tidsuttryck", es: "durante la guerra", sv: "under kriget" },
      { cat: "F", catName: "F. Tidsuttryck", es: "finalmente / al final", sv: "slutligen / till slut" },
      { cat: "F", catName: "F. Tidsuttryck", es: "en 1936 / en julio de 1936 / en 1939", sv: "år 1936 / i juli 1936 / år 1939" }
    ];

    let currentList = [...vocabulary];
    let currentIndex = 0;
    let isFlipped = false;
    let masteredSet = new Set();

    document.getElementById('total-count').innerText = vocabulary.length;

    function renderCard() {
      if (currentList.length === 0) {
        document.getElementById('card-es').innerText = "¡Enhorabuena!";
        document.getElementById('card-sv').innerText = "Du har gått igenom alla kort i denna kategori.";
        document.getElementById('card-category-tag').innerText = "Klart!";
        document.getElementById('current-index').innerText = "0";
        document.getElementById('filtered-total').innerText = "0";
        return;
      }

      const card = currentList[currentIndex];
      document.getElementById('card-es').innerText = card.es;
      document.getElementById('card-sv').innerText = card.sv;
      document.getElementById('card-category-tag').innerText = card.catName;
      document.getElementById('current-index').innerText = currentIndex + 1;
      document.getElementById('filtered-total').innerText = currentList.length;

      // Reset flip state visually
      const flashcardEl = document.getElementById('flashcard');
      flashcardEl.classList.remove('rotate-y-180');
      isFlipped = false;
    }

    function flipCard() {
      const flashcardEl = document.getElementById('flashcard');
      isFlipped = !isFlipped;
      if (isFlipped) {
        flashcardEl.classList.add('rotate-y-180');
      } else {
        flashcardEl.classList.remove('rotate-y-180');
      }
    }

    function nextCard() {
      if (currentList.length === 0) return;
      currentIndex = (currentIndex + 1) % currentList.length;
      renderCard();
    }

    function prevCard() {
      if (currentList.length === 0) return;
      currentIndex = (currentIndex - 1 + currentList.length) % currentList.length;
      renderCard();
    }

    function markStatus(mastered) {
      if (currentList.length === 0) return;

      const card = currentList[currentIndex];
      if (mastered) {
        masteredSet.add(card.es);
      } else {
        masteredSet.delete(card.es);
      }

      document.getElementById('mastered-count').innerText = masteredSet.size;
      nextCard();
    }

    function filterCategory() {
      const selected = document.getElementById('category-select').value;
      if (selected === 'all') {
        currentList = [...vocabulary];
      } else {
        currentList = vocabulary.filter(item => item.cat === selected);
      }
      currentIndex = 0;
      renderCard();
    }

    function shuffleCards() {
      for (let i = currentList.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [currentList[i], currentList[j]] = [currentList[j], currentList[i]];
      }
      currentIndex = 0;
      renderCard();
    }

    function resetProgress() {
      masteredSet.clear();
      document.getElementById('mastered-count').innerText = "0";
      filterCategory();
    }

    // Keyboard controls
    document.addEventListener('keydown', (e) => {
      if (e.key === 'ArrowRight') nextCard();
      if (e.key === 'ArrowLeft') prevCard();
      if (e.key === ' ' || e.key === 'ArrowUp' || e.key === 'ArrowDown') {
        e.preventDefault();
        flipCard();
      }
    });

    // Initial render
    renderCard();
  </script>
</body>
</html>
